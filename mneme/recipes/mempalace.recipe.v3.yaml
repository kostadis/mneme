# mneme recipe v3 (feature 007). Adds `kinds:` for declared-corpus campaigns: a campaign lists
# its curated files per kind in .mneme/corpus.yaml, and each kind becomes one wing. Wing-model
# campaigns keep working: `mechanical` and `scaffold` are copied unchanged from v2 (research R6).
# `default_trust` applies when corpus.yaml omits a standard kind's trust; `rooms_hint` seeds the
# rooms of the derived root mempalace.yaml.
version: "3.0.0"

kinds:
  - name: npcs
    default_trust: authoritative
    rooms_hint: [npcs, general]
  - name: summaries
    default_trust: authoritative
    rooms_hint: [summary, narration, general]
  - name: party
    default_trust: authoritative
    rooms_hint: [party, general]
  - name: grounding
    default_trust: authoritative
    rooms_hint: [world, arcs, general]
  - name: prep
    default_trust: reference
    rooms_hint: [prep, general]

mechanical:
  baseline_exclusions:
    - logs/
    - voice/
    - examples/
    - .claude/
    - .mneme/            # mneme's own palace metadata (owner.yaml, mempalace.yaml) — never content
    - .mcp.json          # GH #28 — rendered mcp face (MCP server config), not content
    - MEMPALACE.md
    - "*.sh"
    - config.yaml
    - ui_config.yaml     # legacy name (kept in case it resurfaces)
    - ui_state.yaml      # GH #28 — the REAL CG UI/session-state file, rewritten every run
    - entities.json
    - refs.yaml          # GH #28 — rpg-lib reference index, not narrative content
    - refs.local.yaml    # GH #28 — local rpg-lib reference overrides
    - .dedup_state.json  # GH #28 — dossier-merge bookkeeping (matches at any depth, e.g. docs/npcs/)
  mining_order: subscopes_before_root
  tunnel_rooms: [npcs, world]
  hazards:
    - "init_overwrites_root_yaml: mempalace init regenerates the root mempalace.yaml; the derived file is regenerated by mneme anyway."

scaffold:
  # The standard 6-wing model — preferred when its source dirs exist. Wings are listed
  # sub-scopes-before-root (notes/sessions before notes; root '.' last) per FR-004.
  - id: standard
    wings:
      - name: narrative
        trust: authoritative
        source_hint: docs/chapters
        rooms_hint: [chapters, general]
      - name: chronicle
        trust: accelerator
        source_hint: docs/distill_extractions
        rooms_hint: [npcs, world, arcs, general]
      - name: prep
        trust: reference
        source_hint: notes/sessions
        rooms_hint: [prep, general]
      - name: notes
        trust: reference
        source_hint: notes
        rooms_hint: [prep, handouts, design, references, general]
      - name: summaries
        trust: reference
        source_hint: summaries
        rooms_hint: [narration, extractions, summary, general]
      - name: "<campaign>"
        trust: reference
        source_hint: .
        rooms_hint: [npcs, party, world, arcs, general]
  # Fallbacks for campaigns missing the richer dirs.
  - id: three_wing
    wings:
      - name: narrative
        trust: authoritative
        source_hint: docs/chapters
        rooms_hint: [chapters, general]
      - name: chronicle
        trust: accelerator
        source_hint: docs/distill_extractions
        rooms_hint: [npcs, world, arcs, general]
      - name: "<campaign>"
        trust: reference
        source_hint: .
        rooms_hint: [npcs, party, world, arcs, mechanics, dead, general]
  - id: two_wing
    wings:
      - name: narrative
        trust: authoritative
        source_hint: docs/chapters
        rooms_hint: [chapters, general]
      - name: "<campaign>"
        trust: reference
        source_hint: .
        rooms_hint: [npcs, party, world, general]
  - id: single_wing
    wings:
      - name: "<campaign>"
        trust: reference
        source_hint: .
        rooms_hint: [general]
